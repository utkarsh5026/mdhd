name: Storage GC (orphaned files)

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no deletes)"
        required: true
        default: "true"
      grace_days:
        description: "Only delete objects older than N days"
        required: true
        default: "7"

jobs:
  gc:
    name: Orphaned storage cleanup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    env:
      # Required by Config::from_env()
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
      SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

      # Reduce noise; GC doesn't need SQLx compile-time checking
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Run orphaned storage GC
        shell: bash
        run: |
          set -euo pipefail

          GRACE_DAYS="${{ inputs.grace_days || '7' }}"
          DRY_RUN="${{ inputs.dry_run || 'true' }}"

          ARGS=(gc-orphaned-storage --grace-days "${GRACE_DAYS}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          cargo run --quiet -- "${ARGS[@]}"
