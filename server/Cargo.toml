[package]
name = "mdhd-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-gzip",
    "set-header",
    "timeout",
    "request-id",
    "util",
] }
time = "0.3"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
] }

# Auth
jsonwebtoken = "9"
oauth2 = "5.0.0-rc.1"
reqwest = { version = "0.12", features = ["json"] }

# S3 / Storage
aws-sdk-s3 = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
url = "2"


governor = "0.10"
tower_governor = { version = "0.8", default-features = false, features = [
    "axum",
] }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
